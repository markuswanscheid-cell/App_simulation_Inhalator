
<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulmoSmart Inhaler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      /* Custom scrollbar for better medical aesthetic */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* LED Animations */
      @keyframes triple-blink-green {
        0%, 20%, 40%, 60%, 100% { opacity: 0.2; background-color: #22c55e; }
        10%, 30%, 50% { opacity: 1; background-color: #22c55e; box-shadow: 0 0 15px #22c55e; }
      }
      @keyframes triple-blink-red {
        0%, 20%, 40%, 60%, 100% { opacity: 0.2; background-color: #ef4444; }
        10%, 30%, 50% { opacity: 1; background-color: #ef4444; box-shadow: 0 0 15px #ef4444; }
      }
      @keyframes alternating-rg {
        0%, 49% { background-color: #ef4444; box-shadow: 0 0 15px #ef4444; }
        50%, 100% { background-color: #22c55e; box-shadow: 0 0 15px #22c55e; }
      }
      .animate-blink-green {
        animation: triple-blink-green 2.5s infinite;
      }
      .animate-blink-red {
        animation: triple-blink-red 2.5s infinite;
      }
      .animate-alt-rg {
        animation: alternating-rg 0.3s infinite;
      }
      .animate-pulse-slow {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>

}
</script>

</html>
